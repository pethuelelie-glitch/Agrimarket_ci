<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>AgriMarket CI — Marché agricole ivoirien</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="AgriMarket CI : mise en relation entre producteurs, acheteurs et livreurs de Côte d'Ivoire. Achats et vente de produits agricoles en toute simplicité."
    />
    <meta name="theme-color" content="#0e3b29" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c120e" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Applique le thème mémorisé avant le premier rendu (évite un flash clair/sombre).
      try {
        var theme = localStorage.getItem('agrimarket.theme');
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.setAttribute('data-theme', theme);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
